[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premier-league-analytics"
version = "0.1.0"
description = "Player valuation, scouting and match prediction analytics platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "plotly>=5.24",
    "matplotlib>=3.9",
    "streamlit>=1.49",
    "joblib>=1.4"
]

[project.scripts]
pl-db-smoke = "pl_analytics.data.database:main"
pl-ingest = "pl_analytics.data.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "jupyterlab>=4.2",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
    "pre-commit>=3.8"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
