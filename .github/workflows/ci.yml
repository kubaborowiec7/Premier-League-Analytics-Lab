name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pl_analytics
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pl_analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall src

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest

      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pl_analytics
        run: pytest tests/test_postgres_ingestion.py tests/test_postgres_analytics.py

      - name: Pinned public-data ingestion and replay
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pl_analytics
        run: python scripts/verify_ingestion.py --load --initialize-schema

      - name: Upload ingestion verification report
        uses: actions/upload-artifact@v4
        with:
          name: m1-ingestion-verification
          path: artifacts/m1-verification.json

      - name: PostgreSQL analytics installation, replay and coverage
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/pl_analytics
        run: |
          python scripts/verify_analytics.py --install --manifest data/manifests/m1_sources.json
          python scripts/verify_analytics.py --install --manifest data/manifests/m1_sources.json

      - name: Upload analytics verification report
        uses: actions/upload-artifact@v4
        with:
          name: m2-analytics-verification
          path: artifacts/m2-verification.json

      - name: Offline EDA report and clean-kernel notebook
        run: |
          python scripts/run_quality.py
          python scripts/execute_quality_notebook.py

      - name: Upload EDA report and executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: m3-data-quality
          path: |
            artifacts/m3-quality.json
            artifacts/m3-executed.ipynb
            artifacts/m3/*.png

      - name: Pinned player analytics and reproducible profile
        run: python scripts/build_player_analytics.py --download

      - name: Upload player profile and statistical artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m4-player-analytics
          path: |
            artifacts/m4/profile.json
            artifacts/m4/player_profile.png
            data/processed/m4/*.parquet
