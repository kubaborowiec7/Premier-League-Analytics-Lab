name: Refresh current football data

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional. A public FPL team ID (repository variable) adds the squad to the build.
      FPL_ENTRY_ID: ${{ vars.FPL_ENTRY_ID }}
      # Optional. A private repository URL with a write token (repository secret) turns on
      # publishing for the hosted app; see docs/HOSTING.md.
      DEPLOY_REMOTE: ${{ secrets.DEPLOY_REMOTE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Reproduce frozen classifier dependency
        run: |
          python scripts/train_match_ml.py --stage select --download
          python scripts/train_match_ml.py --stage final --download
      - name: Refresh current snapshots and operational artifacts
        run: python scripts/refresh_current_data.py
      - name: Verify generated artifacts
        run: |
          ruff check .
          pytest tests/test_current_refresh.py tests/test_dashboard_artifacts.py
      - name: Publish refreshed data to the private app repository
        if: ${{ env.DEPLOY_REMOTE != '' }}
        run: python scripts/publish_private_app.py
      - name: Upload portable refresh bundle
        uses: actions/upload-artifact@v4
        with:
          name: current-football-data-${{ github.run_id }}
          retention-days: 14
          path: |
            artifacts/live/
            artifacts/dashboard/live_catalog.json
            data/processed/advanced/
            data/processed/fpl/
